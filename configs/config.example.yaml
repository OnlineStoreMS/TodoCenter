server:
  port: 8102
  mode: debug

database:
  driver: postgres
  # 本地开发建议 host=127.0.0.1；部署由 deploy/scripts/sync-configs.sh 写入
  postgres_dsn: "host=127.0.0.1 user=todocenter password=todocenter dbname=todocenter port=5432 sslmode=disable TimeZone=Asia/Shanghai"

auth:
  enabled: true
  jwt_secret: "与 UserCore 一致"

storage:
  driver: local                  # local | minio（部署用 minio，见 deploy/configs/todocenter.yaml）
  prefix: "uploads"
  local_path: "./data/uploads"
  public_base_url: "http://127.0.0.1:8102/uploads"
  minio:
    endpoint: "127.0.0.1:9100"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "todocenter"
    use_ssl: false
    prefix: "uploads"
    public_read: true

cors:
  allow_origins:
    - "http://localhost:5186"
    - "http://127.0.0.1:5186"
    - "http://localhost:5174"
    - "http://127.0.0.1:5174"
